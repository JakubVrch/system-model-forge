name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      # Includes compiled CLI, filesystem behavior, and production tarball installation.
      - run: npm test
      - run: npm run build
